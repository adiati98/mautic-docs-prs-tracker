name: Update Docs PR Tracker

on:
  schedule:
    # All times target the same Central European local wall-clock hour
    # year-round. GitHub Actions cron has no DST support, so each rule is
    # duplicated for CEST (UTC+2, roughly Apr-Oct) and CET (UTC+1, roughly
    # Nov-Mar), restricted via the month field. This only leaves drift
    # during the DST transition weeks themselves (late Mar / late Oct),
    # instead of for half the year - accepted tradeoff for an internal tool.
    #
    # Every mark below sits at :07, not :00/:30. GitHub Actions runs
    # scheduled workflows best-effort and de-prioritizes them under load, and
    # :00/:30 are the most oversubscribed minutes platform-wide (everyone's
    # default cron), which was causing runs to land 30-60+ min late. Offsetting
    # by 7 minutes keeps the same cadence while dodging that queue - this tool
    # is used org-wide and needs to actually be near-live, not just eventually
    # consistent.
    #
    # Incremental update, hourly, ~9am-9pm CE time, Mon-Fri.
    #
    # This was every half hour (26 marks a weekday) until 31 Aug 2026. From
    # 27 Aug 2026 GitHub started delivering only 1-3 of those 26, down from a
    # steady 11-15/day over the three weeks before, with some runs landing
    # 7+ hours late (02:18 and 03:32 UTC, hours after the 19:07 UTC window
    # closed). Nothing on this side changed: cron valid, no failures since
    # 17 Aug, runs finish in 1-4 min so the concurrency group never blocks
    # anything, public repo so no minutes limit.
    #
    # The one pattern in the data: the low-frequency weekend rules below
    # (2-3 marks/day) were delivered in full all month, while the
    # high-frequency weekday rules were dropped. That is consistent with
    # GitHub throttling frequent schedules harder - not documented policy, so
    # treat it as a hypothesis. Halving the ask to 13 marks tests it, and
    # costs nothing while only 1-3 are arriving anyway. Hourly, not 2-hourly,
    # because a 2-hour-stale report lets two maintainers pick up the same PR
    # without seeing each other's claim.
    #
    # Revisit ~9 Sep 2026: if delivery is back to ~10+/day, keep this. If it
    # is still 1-3, GitHub's scheduler is not usable here and the trigger
    # should move to an external timer calling workflow_dispatch. Either way,
    # if the schedule changes again, update the note in README.md's
    # Automation section too.
    - cron: "7 7-19 * 4-10 1-5" # CEST: ~9am-9pm = 7-19 UTC
    - cron: "7 8-20 * 11,12,1,2,3 1-5" # CET: ~9am-9pm = 8-20 UTC
    # Weekend: two incremental check-ins each day (Sat and Sun), ~10am and
    # ~9pm CE time - same cadence both days.
    - cron: "7 8 * 4-10 6,0" # CEST: ~10am = 8 UTC, ~9pm = 19 UTC
    - cron: "7 19 * 4-10 6,0"
    - cron: "7 9 * 11,12,1,2,3 6,0" # CET: ~10am = 9 UTC, ~9pm = 20 UTC
    - cron: "7 20 * 11,12,1,2,3 6,0"
    # Weekly full resync - ~midnight Monday CE time, its own separate slot
    # rather than reusing Sunday's ~9pm incremental run above.
    - cron: "7 22 * 4-10 0" # CEST: ~midnight Mon = 22 UTC Sun
    - cron: "7 23 * 11,12,1,2,3 0" # CET: ~midnight Mon = 23 UTC Sun
  workflow_dispatch:
    inputs:
      fresh:
        description: "Force a full fresh fetch (ignore the cache)"
        type: boolean
        default: false

# Serialize runs instead of racing on data/pr-cache.json or the git branch -
# a manual dispatch overlapping a scheduled run waits rather than cancels,
# since cancelling mid-fetch or mid-push could leave things half-updated.
concurrency:
  group: docs-pr-tracker
  cancel-in-progress: false

# Deny-by-default; each job grants only what it needs.
permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # GITHUB_TOKEN here is the tracker's own read-only PAT (repo secret),
      # used only for GitHub API reads against the public mautic/* repos -
      # unrelated to the ambient token used below to push back to this repo.
      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.TRACKER_PAT }}
        run: |
          if [ "${{ github.event.schedule }}" = "7 22 * 4-10 0" ] || [ "${{ github.event.schedule }}" = "7 23 * 11,12,1,2,3 0" ] || [ "${{ inputs.fresh }}" = "true" ]; then
            echo "Running full fresh fetch..."
            node tracker.js --fresh
          else
            echo "Running incremental update..."
            node tracker.js
          fi

      - name: Commit and push updated report + cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker-report.html tracker-reminders.html tracker-guide.html data/pr-cache.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update tracker report [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Stage report for Pages
        run: |
          mkdir -p _site
          # Published under both names: index.html is the Pages entry point,
          # and the plain filenames keep the dashboard's, reminders page's,
          # and guide's cross-links (which use their local dev filenames)
          # working on the deployed site too.
          cp tracker-report.html _site/index.html
          cp tracker-report.html _site/tracker-report.html
          cp tracker-reminders.html _site/tracker-reminders.html
          cp tracker-guide.html _site/tracker-guide.html
          # Screenshots referenced by the guide (relative paths like
          # assets/guide/foo.png) live in the repo and aren't generated,
          # so they're copied as-is rather than staged by tracker.js.
          cp -r assets _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
